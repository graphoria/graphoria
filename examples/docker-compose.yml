# Backing services for local Graphoria testing.
#
#   docker compose -f examples/docker-compose.yml up -d
#
# Then run your Graphoria server on the host with `bun run index.ts`.
# Credentials below match the config in docs/QUICKSTART.md.
#
# Taskly can run here too, built from examples/taskly/Dockerfile (it takes the
# host's port 3000, so stop a host-run Taskly first):
#
#   docker compose -f examples/docker-compose.yml --profile taskly up -d --build
services:
  postgres:
    image: postgres:18
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: my_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Alternative database engines — uncomment the one you want (and optionally
  # comment out postgres above). Matching Taskly seed ports live in
  # taskly/seed.mssql.sql and taskly/seed.mysql.sql.

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: mysqlpassword
      MYSQL_DATABASE: my_app
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pmysqlpassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -N -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  # The MSSQL image cannot pre-create a database, so this one-shot container
  # creates my_app once the server accepts connections, then exits.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
    entrypoint:
      [
        "/bin/sh",
        "-c",
        '/opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -N -b -Q "IF DB_ID(''my_app'') IS NULL CREATE DATABASE [my_app]"',
      ]

  # Required only when auth is enabled (token store) or CACHE_STORE=redis.
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Optional — only needed for the message-queue features.
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Taskly in its own image. Off unless the profile is named (see the header).
  taskly:
    profiles: [taskly]
    build: ./taskly
    # Bun as PID 1 ignores SIGTERM; the init forwards it, so `stop` is immediate.
    init: true
    restart: on-failure
    env_file:
      - path: taskly/.env.example
      - path: taskly/.env
        required: false
    environment:
      PG_HOST: postgres
      MYSQL_HOST: mysql
      MSSQL_HOST: mssql
      RABBITMQ_HOST: rabbitmq
      REDIS_URL: redis://redis:6379
      # The image cannot write under /app.
      PRINT_SCHEMAS: "false"
    ports:
      - "3000:3000"
    # Graphoria connects once at boot, with no retry.
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  dbgate:
    image: dbgate/dbgate
    restart: always
    ports:
      - 9000:3000
    volumes:
      - dbgate-data:/root/.dbgate
    environment:
      CONNECTIONS: con1,con2,con3

      LABEL_con1: postgres
      SERVER_con1: postgres
      USER_con1: postgres
      PASSWORD_con1: postgrespassword
      PORT_con1: 5432
      ENGINE_con1: postgres@dbgate-plugin-postgres

      LABEL_con2: mysql
      SERVER_con2: mysql
      USER_con2: root
      PASSWORD_con2: mysqlpassword
      PORT_con2: 3306
      ENGINE_con2: mysql@dbgate-plugin-mysql

      LABEL_con3: mssql
      SERVER_con3: mssql
      USER_con3: sa
      PASSWORD_con3: Str0ng!Passw0rd
      PORT_con3: 1433
      ENGINE_con3: mssql@dbgate-plugin-mssql

volumes:
  postgres-data:
  dbgate-data:
