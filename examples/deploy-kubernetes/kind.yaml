# One node, pinned so that the example does not drift. The gateway's Service listens on node port
# 30443 (gateway-class.yaml); it is published on the host's loopback as port 8443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: graphoria
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        listenAddress: 127.0.0.1
