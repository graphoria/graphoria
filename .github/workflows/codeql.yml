name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:17 UTC. Off the hour because GitHub's scheduler queues heavily
    # on the hour and delays runs.
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # No build step: CodeQL analyses JS/TS from source, and the repo's own
      # build emits nothing it needs.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
