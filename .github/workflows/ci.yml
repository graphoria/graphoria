name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept at or above the root package.json `engines.bun` floor (>=1.3.4). Pinned
  # rather than floating so a Bun release cannot turn a green PR red on its own.
  BUN_VERSION: 1.3.14

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun test
