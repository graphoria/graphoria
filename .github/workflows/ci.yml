name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept at or above the root package.json `engines.bun` floor (>=1.3.4). Pinned
  # rather than floating so a Bun release cannot turn a green PR red on its own.
  BUN_VERSION: 1.4.0

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exits non-zero only for high and critical advisories; moderate and low
      # are reported by the run but do not fail it, so a low-severity advisory
      # in a transitive dev dependency cannot block an unrelated merge.
      # Dependabot is what carries those forward.
      - name: Audit dependencies
        run: bun audit --audit-level=high

  # Runs on every PR but is deliberately not a required status check: it boots
  # three real database engines, and a container that fails to come up should
  # not block a merge on its own. Watch it before promoting it to required.
  integration:
    name: Integration (pg, mysql, mssql)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # packages/server/playgrounds/ is a gitignored build artefact, but
      # createHandlers reads its HTML unconditionally at boot. Without this the
      # harness cannot start a server on a fresh checkout.
      - name: Build playgrounds
        run: bun run --filter @graphoria/server build:playgrounds

      # --wait blocks on the healthchecks in docker-compose.test.yml and fails
      # the step if a container never reports healthy. SQL Server is the long
      # pole at ~30-60s, hence the raised timeout.
      - name: Start backing services
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 180

      - name: Integration tests
        run: bun run test:integration

      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Stop backing services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
