# Backing services for the integration test suite.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   INTEGRATION=1 bun test packages/server/src/__test/integration
#   docker compose -f docker-compose.test.yml down -v
#
# Ports are deliberately non-default so this stack can run alongside a
# developer's own database instances. Nothing is persisted to a volume — the
# suite recreates its schema on every run, and `down` should leave no state
# behind.
#
# Credentials are duplicated in packages/server/src/__test/integration/config.ts.
# Change them in both places or the suite will not connect.
name: graphoria-test

services:
  postgres:
    image: postgres:18
    shm_size: 128mb
    # pg_stat_statements is how the N+1 audit counts the statements the server
    # actually sends. It only loads from shared_preload_libraries, so it has to
    # be a server flag rather than a CREATE EXTENSION alone.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: graphoria_test
      POSTGRES_DB: graphoria_test
    ports:
      - "55432:5432"
    # postgres:18 wants the mount one level up from the data directory.
    tmpfs:
      - /var/lib/postgresql
    # Over TCP on purpose, not the unix socket — see the MySQL healthcheck below
    # for what a socket probe reports healthy too early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d graphoria_test"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  mysql:
    image: mysql:8
    command: --local-infile=0 --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: graphoria_test
      MYSQL_DATABASE: graphoria_test
    ports:
      - "53306:3306"
    tmpfs:
      - /var/lib/mysql
    # `--protocol=TCP` is the whole point of this probe. On first boot the MySQL
    # entrypoint runs a *temporary* server to create the database, and that one
    # listens on the unix socket only (`port: 0`). A plain `mysqladmin ping`
    # reaches it, so the container reports healthy, `up --wait` returns, and the
    # entrypoint then shuts the temporary server down to start the real one —
    # any client that connected in that window dies with
    # `MySQLError: Connection closed`. Probing 3306 over TCP cannot pass until
    # the real server is up.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -P 3306 --protocol=TCP -uroot -pgraphoria_test --silent",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The SQL Server image cannot pre-create a database, so the suite issues
  # CREATE DATABASE against `master` during setup. The healthcheck only proves
  # the engine is accepting connections.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Graphoria_test1"
      MSSQL_PID: Developer
    ports:
      - "51433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -N -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7
    command: redis-server --save "" --appendonly no
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
